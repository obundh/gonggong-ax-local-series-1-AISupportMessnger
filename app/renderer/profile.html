<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="profile-body">
    <main class="profile-window">
      <div class="window-controls profile-window-controls" aria-label="창 제어">
        <button type="button" data-window-action="minimize" aria-label="최소화"><span></span></button>
        <button type="button" data-window-action="close" aria-label="닫기"><span></span></button>
      </div>

      <section class="profile-hero" id="profileHero" aria-label="프로필"></section>
    </main>

    <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="data.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
